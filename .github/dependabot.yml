version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      major:
        update-types:
          - 'major'
      minor-and-patch:
        update-types:
          - 'patch'
          - 'minor'

  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '.github/actions/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      major:
        update-types:
          - 'major'
      minor-and-patch:
        update-types:
          - 'patch'
          - 'minor'
